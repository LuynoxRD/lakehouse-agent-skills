[project]
name = "lakehouse-agent-skills"
version = "0.2.0"
description = "Repository tooling for lakehouse-agent-skills: validators, the eval runner, and fixture generators."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis Castillo" }]
dependencies = []

[project.optional-dependencies]
# Quality gates. Validators and the eval runner import the standard library only;
# nothing in this group is imported by scripts/.
dev = [
  "ruff>=0.16.6,<1",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pre-commit>=4.6.2,<5",
  "zizmor>=1.30.0,<2",
  "semgrep>=1.176.0,<2; sys_platform == 'linux'",
]
# Used only by evals/fixtures/<skill>/generate.py to produce synthetic fixtures.
fixtures = [
  "openpyxl>=3.1.5,<4",
  "pyarrow>=25.0.1,<27",
  "duckdb>=1.5.5,<2",
]

[tool.uv]
# The repository is not a distributable Python package; uv only manages the environment.
package = false
# semgrep pins mcp==1.29.0, inside GHSA-84m7-p3x7-pcfv (fixed in 1.30.0). Only `semgrep mcp`
# imports it and nothing here serves MCP, but the lock should not carry the advisory either.
# Remove this once semgrep's own pin reaches 1.30.0.
override-dependencies = ["mcp>=1.30.0,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests"]
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "PL", "PT", "ANN",
  "ARG", "PTH", "ERA", "RET", "TRY", "PERF", "ISC", "PIE", "A", "BLE", "FBT", "T20",
]
ignore = [
  "TRY003", # long messages inside exceptions are fine for CLI tools
]

[tool.ruff.lint.per-file-ignores]
# Validators and the eval runner talk to the terminal on purpose.
"scripts/*.py" = ["T20"]
# Tests assert, compare literal numbers, spawn git, and build fixtures freely.
"tests/**" = ["S101", "PLR2004", "T20", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["lib"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["scripts", "tests"]
mypy_path = ["scripts", "tests"]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q -ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
